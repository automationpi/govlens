name: release

# Build and publish the GovLens image to GitHub Container Registry (GHCR).
#   - push a tag  vX.Y.Z   -> ghcr.io/<owner>/<repo>:X.Y.Z, :X.Y, :latest
#   - push to     main     -> ghcr.io/<owner>/<repo>:edge (rolling)
on:
  push:
    tags: ['v*']
    branches: ['main']

permissions:
  contents: read
  packages: write   # lets the built-in GITHUB_TOKEN push to GHCR — no PAT needed

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3        # for multi-arch (arm64) emulation
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}   # ghcr.io/<owner>/<repo>
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
